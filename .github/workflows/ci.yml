name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          FREEMODEL_API_KEY: ""   # tests never call the network
      - name: DEMO data is reproducible
        run: |
          cp ../frontend/public/demo/run.json /tmp/run.before.json
          python scripts/make_demo.py
          python - <<'PY'
          import json
          a = json.load(open('/tmp/run.before.json')); b = json.load(open('../frontend/public/demo/run.json'))
          strip = lambda d: [{k: v for k, v in e.items() if k != 'timestamp'} for e in d['events']]
          assert strip(a) == strip(b), 'demo run.json is not reproducible from scripts/make_demo.py'
          print('demo reproducible:', len(a['events']), 'events')
          PY
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No API keys committed
        run: |
          if git grep -nE "fm_[0-9a-f]{32,}|sk-[A-Za-z0-9]{20,}" -- . ':!*.lock' ':!package-lock.json'; then echo "possible secret committed"; exit 1; fi
